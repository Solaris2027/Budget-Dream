# Build APK Budget Dream — version renforcée avec diagnostic
name: Build APK Budget Dream

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Version de Flutter fixée : évite les surprises d'une nouvelle version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"

      # Trouve l'app Flutter dans le dépôt et affiche ce qu'il faut
      - name: Localiser l app Flutter (diagnostic)
        run: |
          echo "=== Contenu du dépôt ==="
          ls -la
          PUB=$(find . -type f -name pubspec.yaml -not -path "*/build/*" | sort | head -1)
          if [ -z "$PUB" ]; then
            echo ""
            echo "!!! ERREUR : pubspec.yaml introuvable dans le dépôt !!!"
            echo "=== Dossiers présents (3 niveaux) ==="
            find . -maxdepth 3 -type d -not -path "*/.git*" | head -40
            exit 1
          fi
          echo "PROJ=$(dirname "$PUB")" >> "$GITHUB_ENV"
          echo "=== Projet détecté dans : $(dirname "$PUB") ==="
          echo "=== Contenu du pubspec.yaml ==="
          cat "$PUB"

      - name: Générer la plateforme Android
        working-directory: ${{ env.PROJ }}
        run: flutter create . --platforms android --org fr.budgetdream --project-name budget_dream_app

      - name: Autoriser HTTP en développement
        working-directory: ${{ env.PROJ }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Dépendances Flutter
        working-directory: ${{ env.PROJ }}
        run: flutter pub get

      - name: Compiler l APK release
        working-directory: ${{ env.PROJ }}
        run: flutter build apk --release

      - name: Publier l APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: budget-dream-apk
          path: ${{ env.PROJ }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
