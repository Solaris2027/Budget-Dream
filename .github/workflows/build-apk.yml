yaml
# Budget Dream — version WEB pour iPhone (GitHub Pages)
#
# Construit la version web de l'app et la publie gratuitement sur
# GitHub Pages. Ensuite, sur iPhone :
# Safari -> URL du site -> Partager -> "Sur l'écran d'accueil".

name: Publier Budget Dream (web iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch: {} # bouton "Run workflow" manuel dans l onglet Actions

permissions:
  pages: write
  id-token: write

jobs:
  web:
    name: Site web (iPhone)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Version de Flutter fixée : environnement connu et reproductible
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"

      # Trouve l app Flutter dans le dépôt (diagnostic en français)
      - name: Localiser l app Flutter (diagnostic)
        run: |
          echo "=== Contenu du dépôt ==="
          ls -la
          PUB=$(find . -type f -name pubspec.yaml -not -path "*/build/*" | sort | head -1)
          if [ -z "$PUB" ]; then
            echo ""
            echo "!!! ERREUR : pubspec.yaml introuvable dans le dépôt !!!"
            echo "=== Dossiers présents (3 niveaux) ==="
            find . -maxdepth 3 -type d -not -path "*/.git*" | head -40
            exit 1
          fi
          echo "PROJ=$(dirname "$PUB")" >> "$GITHUB_ENV"
          echo "=== Projet détecté dans : $(dirname "$PUB") ==="

      # Génère le dossier web/ (comme le dossier android/ pour l APK)
      - name: Générer la plateforme Web
        working-directory: ${{ env.PROJ }}
        run: flutter create . --platforms web --org fr.budgetdream --project-name budget_dream_app

      # base-href : le site sera servi sous /<nom-du-dépôt>/ par GitHub Pages
      - name: Compiler la version web
        working-directory: ${{ env.PROJ }}
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      # Joli titre dans Safari et sur l icône de l écran d accueil
      - name: Mettre le titre Budget Dream
        working-directory: ${{ env.PROJ }}
        run: sed -i 's|<title>budget_dream_app</title>|<title>Budget Dream</title>|' web/index.html || true

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJ }}/build/web

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
